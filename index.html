<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주소가 바뀌었어요 · 구로 점심지도</title>
<meta http-equiv="refresh" content="2;url=https://enliple-lunch.github.io/">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d12;color:#eef1f7;font-family:-apple-system,system-ui,sans-serif;text-align:center;padding:24px}a{color:#8ccf3c;font-weight:800;font-size:18px}p{color:#a3acc0;line-height:1.6}</style></head>
<body><div><div style="font-size:44px">🍚</div><h1 style="font-size:20px;margin:10px 0">점심지도 주소가 바뀌었어요</h1><p>새 주소로 이동 중…<br><a id="go" href="https://enliple-lunch.github.io/">enliple-lunch.github.io</a></p><p style="font-size:12px">북마크·홈 화면 아이콘은 새 주소로 다시 추가해주세요.</p></div>
<script>
(async()=>{ const target = 'https://enliple-lunch.github.io/' + location.hash; document.getElementById('go').href = target;
  try{ if('serviceWorker' in navigator){ const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r=>r.unregister())); } if(window.caches){ const ks = await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); } }catch(e){}
  location.replace(target); })();
</script></body></html>
